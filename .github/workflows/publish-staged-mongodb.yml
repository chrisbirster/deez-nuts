name: Publish staged MongoDB nut

on:
  push:
    branches: [main]
    paths:
      - .github/publish-mongodb-now

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and validate deck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nuts/mongodb
          base64 -d tools/study_data/mongodb.b64 | gzip -dc > nuts/mongodb/mongodb.nut
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('nuts/mongodb/mongodb.nut')
          lines = path.read_text().splitlines()
          assert lines, 'empty deck'
          header = json.loads(lines[0])
          assert header == {'kind':'deck','format':'deez.nut','version':2,'name':'MongoDB'}, header
          notes = [json.loads(line) for line in lines[1:] if line.strip()]
          assert len(notes) == 450, len(notes)
          assert all(n.get('kind') == 'note' for n in notes)
          print(f'validated MongoDB: {len(notes)} notes')
          PY
      - name: Commit published nut and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuts/mongodb/mongodb.nut
          git rm tools/study_data/mongodb.b64
          git rm -f .github/workflows/inspect-staged-mongodb.yml .github/inspect-mongodb-now
          git rm -f .github/workflows/publish-staged-mongodb.yml .github/publish-mongodb-now
          git commit -m "Publish MongoDB study nut"
          git push
