name: Restore staged study generator

on:
  push:
    branches: [main]
    paths:
      - .github/restore-study-generator-now

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble staged generator
        shell: bash
        run: |
          set -euo pipefail
          cat tools/study_archive/part* | tr -d '\n\r' | base64 -d > /tmp/study-generator.xz
          xz -dc /tmp/study-generator.xz > tools/generate_study_decks.py
          python3 -m py_compile tools/generate_study_decks.py
      - name: Commit restored generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_study_decks.py
          git rm .github/workflows/restore-study-generator.yml .github/restore-study-generator-now
          git commit -m "Restore staged study deck generator"
          git push
